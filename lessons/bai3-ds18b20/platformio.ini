; Cấu hình dự án PlatformIO
[env:esp32dev]
platform = espressif32  ; họ chip ESP32
board = esp32dev        ; bo ESP32 DevKit phổ biến
framework = arduino     ; vẫn dùng thư viện Arduino quen thuộc
monitor_speed = 115200  ; ESP32 hay dùng tốc độ này, khớp với Serial.begin()

; Thư viện tự động tải về khi build lần đầu
lib_deps =
  paulstoffregen/OneWire@^2.3.8              ; giao tiếp 1 dây
  milesburton/DallasTemperature@^3.11.0      ; đọc cảm biến DS18B20
